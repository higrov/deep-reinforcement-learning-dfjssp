# Basic logging configuration
# For simple experiments and testing

[logging]
output_dir = "./experiments"
experiment_name = ""  # Auto-generated if empty
auto_name = true

# Output formats
save_csv = true
save_json = true
save_tensorboard = false

# Summary statistics
summary_every = 50  # Log summary stats every N episodes

# TensorBoard settings (if enabled)
tensorboard_dir = ""  # Uses output_dir/tensorboard if empty
