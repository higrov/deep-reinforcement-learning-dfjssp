# RunInfo:
run-id: # Unique identifier for the run (e.g., JS_Train_DDQN_Generic)
continue-run: false # Set to true and specify run-id if resuming a previous run
notes: # Description of the run's purpose or configuration
tags: # Comma-separated list of tags (e.g., JobShop, Train, DDQN, GenericConfig)

# Environment:
num-agents: 1 # Number of machines in the JobShop environment.
max-num-timesteps: 1000000 # Max simulation time (steps) for an episode in JobShopEnv
seed: # Integer seed for reproducibility, or leave blank for random
device: cpu # 'cpu' or 'cuda'

# Environment Switches
record: false # True to record episode data/videos (if supported)
randomize: false # True to randomize environment parameters if applicable (e.g., instance generation)
level: jobshop_default # Specifies the environment configuration or instance type
num-orders: # Number of jobs (orders) in the JobShop problem
max-num-subtasks: # Maximum number of operations across all jobs (can be an estimate)

# Mode:
play: false # True to run in play/inference mode
train: true # True to run in training mode
evaluate: false # True to run in evaluation mode
test: false # True to run in testing mode (if applicable)

# Files for JobShop
# model_filename will be used for saving the trained model during training
model_filename: trained_model_jobshop.h5 # Generic name for the output model file

# schedule_filename is for loading a specific JSSP instance if your environment supports it.
# Output log names are typically generated dynamically based on run-id or other parameters.
schedule_filename: # Path to a specific JSSP instance file (e.g., ft06.txt) or leave blank