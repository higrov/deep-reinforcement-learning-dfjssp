# Example config for dispatching rule with metrics logging

[env]
# You must programmatically provide global_schedule before calling run_method,
# or adapt your pipeline to populate it. This placeholder indicates expected keys.
# In practice, build the schedule with ScheduleGenerator or a fixture.
num_machines = 4
max_time = 1200000

[method]
name = "dispatching"
[method.config]
rule_index = 0  # choose one of the existing scheduling_rules
episodes = 10   # run multiple episodes for better statistics
use_metrics = true  # enable metrics logging

# Logging configuration
[logging]
output_dir = "./experiments"
experiment_name = "dispatching_rule_comparison"  # or leave empty for auto-generation
auto_name = false

# Output formats
save_csv = true
save_json = true
save_tensorboard = true  # Enable TensorBoard for visualization

# Summary statistics
summary_every = 5  # Log summary stats every 5 episodes

mode = "eval"
